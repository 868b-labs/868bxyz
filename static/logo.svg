<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160">
  <defs>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="white" stop-opacity="1"/>
      <stop offset="52%"  stop-color="white" stop-opacity="1"/>
      <stop offset="70%"  stop-color="white" stop-opacity="0.5"/>
      <stop offset="87%"  stop-color="white" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="hashFade">
      <rect width="400" height="160" fill="url(#fade)"/>
    </mask>
  </defs>

  <!-- 0x prefix -->
  <text
    x="32" y="116"
    font-family="'IBM Plex Mono', 'Liberation Mono', 'Courier New', monospace"
    font-weight="300"
    font-size="32"
    fill="#8478c4"
    fill-opacity="0.42"
    letter-spacing="1"
  >0x</text>

  <!-- 868b hash with fade -->
  <text
    x="70" y="122"
    font-family="'IBM Plex Mono', 'Liberation Mono', 'Courier New', monospace"
    font-weight="700"
    font-size="64"
    fill="#8478c4"
    letter-spacing="-2"
    mask="url(#hashFade)"
  >868b</text>
</svg>
